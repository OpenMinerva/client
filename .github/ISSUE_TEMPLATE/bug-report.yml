name: Bug Report
description: Report a bug
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the sections below to help identify the issue.
  - type: textarea
    id: description
    attributes:
      label: Describe your issue
      placeholder: When I do this action, this result occurs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to page X.
        2. Click here.
        3. Click there.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was the expected result?
      placeholder: I expected this to happen...
  - type: upload
    id: logfile
    attributes:
      label: Provide your log file (if applicable)
    validations:
      required: false
      accept: ".txt,.log"
  - type: upload
    id: screenshots
    attributes:
      label: Put here any screenshots or videos (optional)
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm"
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue! We will get back to you as soon as possible.
