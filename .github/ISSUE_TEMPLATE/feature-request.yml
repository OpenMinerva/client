name: Feature Request
description: Suggest a new feature
labels: ["needs-triage"]
body:
  - type: "textarea"
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is."
      placeholder: "I'm always frustrated when [...]"
    validations:
      required: true
  - type: "textarea"
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
      placeholder: "I want to [...]"
    validations:
      required: true
  - type: "textarea"
    attributes:
      label: "Describe alternatives you've considered"
      description: "A clear and concise description of any alternative solutions or features you've considered. This helps developers formulate an appropriate solution and helps paint a clear picture about your desired outcome."
      placeholder: "I thought I could do [...] to solve my issue, but I ran into issues with [...]."
    validations:
      required: false
  - type: "textarea"
    attributes:
      label: "Additional context"
      description: "Add any other context about the feature request here."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue! We will get back to you as soon as possible.
